  <title>Log File Overwrite Values</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<body>
  <h1>Log File Overwrite Values</h1>

  <p><span class="commande">The following table lists the values to control log file overwrite behavior to use with the batch command</span> <span style="font-family: monospace;">Batch.OverwriteChoice</span>.</p>

  <table style="width: 400px;" border="1" cellpadding="1" cellspacing="0">
    <tbody>
      <tr>
        <td class="kbd">Log File Behavior<br></td>

        <td class="kbd">Value<br></td>
      </tr>

      <tr>
        <td>Always overwrite<br></td>

        <td>1</td>
      </tr>

      <tr>
        <td>Never overwrite<br></td>

        <td>2</td>
      </tr>

      <tr>
        <td>Ask the user<br></td>

        <td>3<br></td>
      </tr>
    </tbody>
  </table><br>
  </body>
</html>
